name: 🗂️ Secretária das Issues

on:
  issues:
    types: [opened, edited, reopened, closed]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-secretary-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  organizar:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Organizar issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const event = context.eventName;
            const action = context.payload.action;
            const actor = context.actor;
            const commentBody = context.payload.comment?.body || "";
            const title = issue.title || "";
            const body = issue.body || "";

            const labels = {
              "type:idea":        { color: "d4c5f9", description: "Ideia ainda em definição" },
              "type:bug":         { color: "d73a4a", description: "Comportamento incorreto ou regressão" },
              "type:enhancement": { color: "a2eeef", description: "Melhoria ou nova funcionalidade" },
              "type:data":        { color: "1d76db", description: "Dados, evidências ou pipeline de dados" },
              "area:ux":          { color: "c5def5", description: "Interface e experiência de uso" },
              "area:data":        { color: "0e8a16", description: "Dados e evidências" },
              "area:governance":  { color: "5319e7", description: "Governança, segurança e regras" },
              "area:automation":  { color: "fbca04", description: "Automação, CI e workflows" },
              "area:docs":        { color: "0075ca", description: "Documentação" },
              "risk:high":        { color: "b60205", description: "Mudança de alto risco técnico ou semântico" },
              "status:triage":    { color: "ededed", description: "Precisa de leitura e definição" },
              "status:specified": { color: "1d76db", description: "Decisão técnica registrada" },
              "status:ready":     { color: "0e8a16", description: "Pronta para implementação" },
              "status:in-progress": { color: "fbca04", description: "Em implementação" },
              "status:blocked":   { color: "b60205", description: "Bloqueada por dependência ou decisão" },
              "status:done":      { color: "5319e7", description: "Concluída" },
              "decision-recorded": { color: "6f42c1", description: "Há decisão técnica registrada nos comentários" }
            };

            for (const [name, meta] of Object.entries(labels)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, ...meta });
                } else {
                  throw error;
                }
              }
            }

            const getIssue = async () => (await github.rest.issues.get({ owner, repo, issue_number })).data;
            const labelNames = data => data.labels.map(l => typeof l === "string" ? l : l.name);

            async function removeByPrefixes(prefixes) {
              const data = await getIssue();
              for (const name of labelNames(data)) {
                if (prefixes.some(prefix => name.startsWith(prefix))) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
              }
            }

            async function add(names) {
              if (!names.length) return;
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: names });
            }

            async function setStatus(status) {
              await removeByPrefixes(["status:"]);
              await add([status]);
            }

            function readSection(label) {
              const escaped = label.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&");
              const match = body.match(new RegExp("###\\s+" + escaped + "\\s*\\n+([^\\n]+)", "i"));
              return match ? match[1].trim() : "";
            }

            if (event === "issues" && ["opened", "edited"].includes(action)) {
              const typeMap = [
                [/^\[IDEIA\]/i, "type:idea"],
                [/^\[BUG\]/i, "type:bug"],
                [/^\[(DADOS|DATA)\]/i, "type:data"],
                [/^\[(MELHORIA|AUTOMATION|RESEARCH|ARCH|GOVERNANCE|TRACKING)\]/i, "type:enhancement"]
              ];
              const matchedType = typeMap.find(([pattern]) => pattern.test(title))?.[1];

              if (matchedType) {
                await removeByPrefixes(["type:"]);
                await add([matchedType]);
              }

              const area = readSection("Área principal");
              const areaMap = {
                "Interface / UX": "area:ux",
                "Dados / evidências": "area:data",
                "Governança / segurança": "area:governance",
                "Automação / CI": "area:automation",
                "Documentação": "area:docs"
              };

              // Forms own their selected area. API/manual Issues keep explicitly assigned
              // multi-area labels instead of losing them on every edit.
              if (areaMap[area]) {
                await removeByPrefixes(["area:"]);
                await add([areaMap[area]]);
              }

              const risk = readSection("Risco técnico");
              if (risk) {
                await removeByPrefixes(["risk:"]);
                if (/^Alto/i.test(risk)) await add(["risk:high"]);
              }

              const latest = await getIssue();
              if (!labelNames(latest).some(name => name.startsWith("status:"))) {
                await add(["status:triage"]);
              }
            }

            if (event === "issues" && action === "reopened") {
              await setStatus("status:ready");
            }

            if (event === "issues" && action === "closed") {
              await setStatus("status:done");
            }

            if (event === "issue_comment" && actor === "joyceradis") {
              if (/##\s*Decisão técnica após revisão/i.test(commentBody)) {
                await add(["decision-recorded"]);
                await setStatus("status:specified");
              }

              if (/^\/ready\b/im.test(commentBody)) await setStatus("status:ready");
              if (/^\/start\b/im.test(commentBody)) await setStatus("status:in-progress");
              if (/^\/blocked\b/im.test(commentBody)) await setStatus("status:blocked");

              if (/^\/done\b/im.test(commentBody)) {
                await setStatus("status:done");
                await github.rest.issues.update({ owner, repo, issue_number, state: "closed", state_reason: "completed" });
              }

              if (/^\/reopen\b/im.test(commentBody)) {
                await github.rest.issues.update({ owner, repo, issue_number, state: "open" });
                await setStatus("status:ready");
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });

            const hasRecordedDecision = comments.some(comment =>
              comment.user?.login === "joyceradis" &&
              /##\\s*Decisão técnica após revisão/i.test(comment.body || "")
            );

            if (hasRecordedDecision) {
              await add(["decision-recorded"]);
            }

            const latest = await getIssue();
            const currentLabels = labelNames(latest);
            const first = prefix => currentLabels.find(name => name.startsWith(prefix)) || "—";

            const statusCard = [
              "<!-- issue-secretary -->",
              "### 🗂️ Organização automática",
              "",
              "| Campo | Estado |",
              "|---|---|",
              "| Tipo | `" + first("type:") + "` |",
              "| Área | `" + first("area:") + "` |",
              "| Risco | `" + (currentLabels.includes("risk:high") ? "risk:high" : "normal/não definido") + "` |",
              "| Status | `" + first("status:") + "` |",
              "| Decisão técnica | " + (currentLabels.includes("decision-recorded") ? "registrada" : "ainda não registrada") + " |",
              "",
              "**Comandos rápidos da mantenedora:**",
              "`/ready` → pronta para implementar · `/start` → em andamento · `/blocked` → bloqueada · `/done` → concluir · `/reopen` → reabrir",
              "",
              "_Este cartão organiza a Issue; decisões técnicas continuam registradas nos comentários humanos._"
            ].join("\n");

            const existing = comments.find(comment => comment.body?.includes("<!-- issue-secretary -->"));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: statusCard
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: statusCard
              });
            }
