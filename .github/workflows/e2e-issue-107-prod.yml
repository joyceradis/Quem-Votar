name: E2E produção #107

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-e2e:
    if: github.head_ref == 'test/issue-107-production-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright isolado
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validar deploy publicado da #107
        env:
          QV_BASE_URL: https://joyceradis.github.io/Quem-Votar/
        run: node tests/e2e_issue_107_prod.cjs
