name: Sincronizar dados eleitorais ES

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sync-dados-eleitorais
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.package.outputs.changed }}
    env:
      # Keep Python bytecode outside the checkout; do not weaken the fail-closed guard.
      PYTHONPYCACHEPREFIX: /tmp/quem-votar-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de evidências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes antes da coleta
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py scripts/coletor_evidencias.py scripts/evidence_coverage_report.py scripts/generate-social-previews.py
          if [ -f app.js ]; then node --check app.js; fi
          find src/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Sincronizar candidaturas ES e Câmara
        run: python scripts/sync-data.py

      - name: Regenerar previews sociais estáticos
        run: python scripts/generate-social-previews.py

      - name: Auditar snapshot candidato
        run: |
          python scripts/audit-site.py
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/generated')
          meta = json.loads((base / 'meta.json').read_text())
          offices = meta.get('offices') or {
              'federal': {}, 'estadual': {}
          }
          mirrors = meta.get('sources', {}).get('operational_mirror') or {}
          all_ids = []
          summary = []
          for kind in offices:
              rows = json.loads((base / f'candidates-{kind}.json').read_text())
              assert rows, f'{kind} vazio'
              assert meta['counts'].get(kind) == len(rows), f'contagem {kind} divergente'
              ids = [x.get('tse_id') for x in rows]
              assert all(ids), f'{kind}: registro sem SQ_CANDIDATO'
              all_ids.extend(ids)
              source = mirrors.get(kind) or {}
              assert source.get('commit_sha'), f'{kind}: sem commit_sha'
              assert source.get('blob_sha'), f'{kind}: sem blob_sha'
              assert source.get('content_sha256'), f'{kind}: sem content_sha256'
              summary.append(f"{len(rows)} {kind}")
          assert len(all_ids) == len(set(all_ids)), 'SQ_CANDIDATO duplicado entre cargos'
          # Deputados federais permanecem obrigatórios (contrato vigente).
          assert 'federal' in offices and 'estadual' in offices
          assert meta.get('sources', {}).get('camara_federal')
          print("Validação OK: " + " / ".join(summary) + f" / {meta['counts'].get('federal_current_mandates_linked', 0)} vínculos Câmara")
          PY

      - name: Garantir que o sync só alterou snapshot e previews derivados
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          if [[ -n "$CHANGED" ]]; then
            INVALID="$(printf '%s\n' "$CHANGED" | grep -Ev '^(data/generated/|social/|sitemap\.xml$)' || true)"
            if [[ -n "$INVALID" ]]; then
              echo "::error::sync tentou alterar arquivo fora de data/generated, social/ ou sitemap.xml:"
              printf '%s\n' "$INVALID"
              exit 1
            fi
          fi

      - name: Empacotar snapshot candidato sem escrever em main
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sync-data-candidate"
          mkdir -p "$OUT/data-generated" "$OUT/social"
          cp -R data/generated/. "$OUT/data-generated/"
          cp -R social/. "$OUT/social/"
          cp sitemap.xml "$OUT/sitemap.xml"
          git diff -- data/generated > "$OUT/data-generated.patch"
          git diff -- social > "$OUT/social-previews.patch"
          git diff -- sitemap.xml > "$OUT/sitemap.patch"
          git diff --stat -- data/generated social sitemap.xml > "$OUT/DIFFSTAT.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$OUT/RUN_METADATA.txt"
          (
            cd "$OUT"
            find data-generated social sitemap.xml -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          if git diff --quiet -- data/generated social sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar artifact auditável do snapshot candidato
        uses: actions/upload-artifact@v4
        with:
          name: sync-data-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/sync-data-candidate
          if-no-files-found: error
          retention-days: 7

  # Motivação (#186): o download do artifact acima depende do host de blob
  # do Actions, que a rede do agente que opera esta lane não alcança. Este
  # job usa a rede do próprio runner (sem essa restrição) para publicar o
  # snapshot já auditado numa branch, de onde o agente abre o PR de dados
  # pela API do GitHub. Não escreve em main; é só o transporte do artifact
  # para um lugar que a lane consegue ler.
  publicar-branch-dados:
    name: Publicar branch com snapshot auditado
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar snapshot já auditado
        uses: actions/download-artifact@v4
        with:
          name: sync-data-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/sync-data-candidate

      - name: Publicar branch com snapshot e checkpoint acoplado
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="data/sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          rm -rf data/generated social
          cp -R "${RUNNER_TEMP}/sync-data-candidate/data-generated" data/generated
          cp -R "${RUNNER_TEMP}/sync-data-candidate/social" social
          cp "${RUNNER_TEMP}/sync-data-candidate/sitemap.xml" sitemap.xml

          # Acopla docs/CHECKPOINT_CURRENT.md no mesmo commit (AGENTS.md §7:
          # PR que toca data/generated/* precisa atualizar o checkpoint).
          # Reescreve só o bloco factual "Snapshot eleitoral público" a
          # partir do meta.json gerado; nenhuma outra seção é tocada.
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          meta = json.loads(Path("data/generated/meta.json").read_text())
          counts = meta["counts"]
          offices = meta.get("offices") or {}
          labels = {
              "federal": "Deputado Federal",
              "estadual": "Deputado Estadual",
              "governador": "Governador",
              "senador": "Senador",
          }
          order = ["federal", "estadual", "governador", "senador"]
          present = [k for k in order if k in offices]
          total = sum(counts.get(k, 0) for k in present)

          lines = [f"- **{total} candidaturas**;"]
          for kind in present:
              lines.append(f"- **{counts[kind]}** para {labels[kind]};")
          lines.append(
              f"- **{counts.get('federal_current_mandates_linked', 0)}** "
              "vínculos atuais com mandato federal na Câmara preservados;"
          )
          lines.append(
              f"- **{counts.get('ales_2025_evidence_linked', 0)}** "
              "evidências institucionais ALES 2025 vinculadas;"
          )
          lines.append(
              f"- **{counts.get('topic_evidence', 0)}** evidências temáticas "
              "canônicas em `data/reference/topic-evidence.json`."
          )
          # A Cerca exige o checkpoint no mesmo PR quando data/generated muda.
          # Se só mudarem valores (não as contagens acima), o bloco ficaria
          # idêntico e o PR de dados falharia por falta de diff no checkpoint.
          # O carimbo da coleta muda a cada snapshot e mantém o acoplamento.
          collected_at = str(meta.get("collected_at") or "")
          stamp = (
              "Última coleta do snapshot: "
              + collected_at[:16].replace("T", " ")
              + " UTC.\n\n"
              if collected_at
              else ""
          )
          block = (
              "## Snapshot eleitoral público\n\nUniverso atual:\n\n"
              + "\n".join(lines)
              + "\n\n"
              + stamp
              + "`SQ_CANDIDATO` permanece a chave eleitoral canônica.\n\n"
              "Nenhuma contagem acima deve ser tratada como avaliação de "
              "candidatura ou completude política."
          )

          path = Path("docs/CHECKPOINT_CURRENT.md")
          text = path.read_text()
          pattern = re.compile(
              r"## Snapshot eleitoral público\n.*?Nenhuma contagem acima deve "
              r"ser tratada como avaliação de candidatura ou completude política\.",
              re.DOTALL,
          )
          new_text, n = pattern.subn(block, text)
          assert n == 1, "bloco 'Snapshot eleitoral público' não encontrado/único"
          path.write_text(new_text)
          PY

          git add data/generated social sitemap.xml docs/CHECKPOINT_CURRENT.md
          git commit -m "data(sync): snapshot eleitoral ES — run ${GITHUB_RUN_ID}

          Snapshot gerado e auditado por sync-data.yml (job sync, run
          ${GITHUB_RUN_ID}); docs/CHECKPOINT_CURRENT.md acoplado no mesmo
          commit conforme AGENTS.md §7. O PR aberto a partir desta branch
          traz o Authorization-Issue no corpo.

          Authorization-Issue: #186"
          git push -u origin "$BRANCH"
