name: Sincronizar dados eleitorais ES

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sync-dados-eleitorais
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Keep Python bytecode outside the checkout so the integrity guard
      # continues to fail closed for every repository path except data/generated.
      PYTHONPYCACHEPREFIX: /tmp/quem-votar-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de evidências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes antes da coleta
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py scripts/coletor_evidencias.py scripts/evidence_coverage_report.py
          node --check app.js
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Sincronizar candidaturas ES e Câmara
        run: python scripts/sync-data.py

      - name: Auditar snapshot candidato
        run: |
          python scripts/audit-site.py
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/generated')
          federal = json.loads((base / 'candidates-federal.json').read_text())
          estadual = json.loads((base / 'candidates-estadual.json').read_text())
          meta = json.loads((base / 'meta.json').read_text())
          assert federal and estadual
          ids = [x.get('tse_id') for x in federal + estadual]
          assert all(ids) and len(ids) == len(set(ids))
          mirrors = meta.get('sources', {}).get('operational_mirror') or {}
          for kind in ('federal', 'estadual'):
              source = mirrors.get(kind) or {}
              assert source.get('commit_sha')
              assert source.get('blob_sha')
              assert source.get('content_sha256')
          assert meta.get('sources', {}).get('camara_federal')
          print(f"Validação OK: {len(federal)} federais / {len(estadual)} estaduais / {meta['counts'].get('federal_current_mandates_linked', 0)} vínculos Câmara")
          PY

      - name: Garantir que o sync só alterou data/generated
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          if [[ -n "$CHANGED" ]]; then
            INVALID="$(printf '%s\n' "$CHANGED" | grep -Ev '^data/generated/' || true)"
            if [[ -n "$INVALID" ]]; then
              echo "::error::sync tentou alterar arquivo fora de data/generated:"
              printf '%s\n' "$INVALID"
              exit 1
            fi
          fi

      - name: Empacotar snapshot candidato sem escrever em main
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sync-data-candidate"
          mkdir -p "$OUT/data-generated"
          cp -R data/generated/. "$OUT/data-generated/"
          git diff -- data/generated > "$OUT/data-generated.patch"
          git diff --stat -- data/generated > "$OUT/DIFFSTAT.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$OUT/RUN_METADATA.txt"
          (
            cd "$OUT/data-generated"
            sha256sum *.json > ../SHA256SUMS.txt
          )
          if git diff --quiet -- data/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar artifact auditável do snapshot candidato
        uses: actions/upload-artifact@v4
        with:
          name: sync-data-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/sync-data-candidate
          if-no-files-found: error
          retention-days: 7
