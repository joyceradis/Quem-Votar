name: Sincronizar dados eleitorais ES

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: sync-dados-eleitorais
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Keep Python bytecode outside the checkout; do not weaken the fail-closed guard.
      PYTHONPYCACHEPREFIX: /tmp/quem-votar-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de evidências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes antes da coleta
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py scripts/coletor_evidencias.py scripts/evidence_coverage_report.py scripts/generate-social-previews.py
          if [ -f app.js ]; then node --check app.js; fi
          find src/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Sincronizar candidaturas ES e Câmara
        run: python scripts/sync-data.py

      - name: Regenerar previews sociais estáticos
        run: python scripts/generate-social-previews.py

      - name: Auditar snapshot candidato
        run: |
          python scripts/audit-site.py
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/generated')
          meta = json.loads((base / 'meta.json').read_text())
          offices = meta.get('offices') or {
              'federal': {}, 'estadual': {}
          }
          mirrors = meta.get('sources', {}).get('operational_mirror') or {}
          all_ids = []
          summary = []
          for kind in offices:
              rows = json.loads((base / f'candidates-{kind}.json').read_text())
              assert rows, f'{kind} vazio'
              assert meta['counts'].get(kind) == len(rows), f'contagem {kind} divergente'
              ids = [x.get('tse_id') for x in rows]
              assert all(ids), f'{kind}: registro sem SQ_CANDIDATO'
              all_ids.extend(ids)
              source = mirrors.get(kind) or {}
              assert source.get('commit_sha'), f'{kind}: sem commit_sha'
              assert source.get('blob_sha'), f'{kind}: sem blob_sha'
              assert source.get('content_sha256'), f'{kind}: sem content_sha256'
              summary.append(f"{len(rows)} {kind}")
          assert len(all_ids) == len(set(all_ids)), 'SQ_CANDIDATO duplicado entre cargos'
          # Deputados federais permanecem obrigatórios (contrato vigente).
          assert 'federal' in offices and 'estadual' in offices
          assert meta.get('sources', {}).get('camara_federal')
          print("Validação OK: " + " / ".join(summary) + f" / {meta['counts'].get('federal_current_mandates_linked', 0)} vínculos Câmara")
          PY

      - name: Garantir que o sync só alterou snapshot e previews derivados
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          if [[ -n "$CHANGED" ]]; then
            INVALID="$(printf '%s\n' "$CHANGED" | grep -Ev '^(data/generated/|social/)' || true)"
            if [[ -n "$INVALID" ]]; then
              echo "::error::sync tentou alterar arquivo fora de data/generated ou social/:"
              printf '%s\n' "$INVALID"
              exit 1
            fi
          fi

      - name: Empacotar snapshot candidato sem escrever em main
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sync-data-candidate"
          mkdir -p "$OUT/data-generated" "$OUT/social"
          cp -R data/generated/. "$OUT/data-generated/"
          cp -R social/. "$OUT/social/"
          git diff -- data/generated > "$OUT/data-generated.patch"
          git diff -- social > "$OUT/social-previews.patch"
          git diff --stat -- data/generated social > "$OUT/DIFFSTAT.txt"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "base_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$OUT/RUN_METADATA.txt"
          (
            cd "$OUT"
            find data-generated social -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          if git diff --quiet -- data/generated social; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar artifact auditável do snapshot candidato
        uses: actions/upload-artifact@v4
        with:
          name: sync-data-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/sync-data-candidate
          if-no-files-found: error
          retention-days: 7
