name: Sincronizar dados eleitorais ES

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-dados-eleitorais
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de evidências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes antes da coleta
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py scripts/coletor_evidencias.py
          node --check app.js
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Sincronizar candidaturas ES e Câmara
        run: python scripts/sync-data.py

      - name: Auditar snapshots antes de publicar
        run: |
          python scripts/audit-site.py
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/generated')
          federal = json.loads((base / 'candidates-federal.json').read_text())
          estadual = json.loads((base / 'candidates-estadual.json').read_text())
          meta = json.loads((base / 'meta.json').read_text())
          assert federal and estadual
          ids = [x.get('tse_id') for x in federal + estadual]
          assert all(ids) and len(ids) == len(set(ids))
          mirrors = meta.get('sources', {}).get('operational_mirror') or {}
          for kind in ('federal', 'estadual'):
              source = mirrors.get(kind) or {}
              assert source.get('commit_sha')
              assert source.get('blob_sha')
              assert source.get('content_sha256')
          assert meta.get('sources', {}).get('camara_federal')
          print(f"Validação OK: {len(federal)} federais / {len(estadual)} estaduais / {meta['counts'].get('federal_current_mandates_linked', 0)} vínculos Câmara")
          PY

      - name: Persistir snapshot sem rebase pós-auditoria
        run: |
          git config user.name "quem-votar-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/generated
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "data: atualiza snapshot ES 2026"
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]]; then
              echo "::error::main avançou durante a execução. Snapshot não será rebaseado sem nova geração/auditoria."
              exit 1
            fi
            git push origin HEAD:main
          fi
