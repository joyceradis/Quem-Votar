name: Overnight V5.5 Evidence Preflight — read only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/overnight-evidence-preflight.yml"
      - "scripts/evidence_coverage_report.py"
      - "tests/test_evidence_coverage_report.py"

permissions:
  contents: read

concurrency:
  group: overnight-v55-evidence-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evidence dependencies
        run: python -m pip install -r requirements-evidence.txt

      - name: Validate code and tests
        run: |
          python -m py_compile scripts/coletor_evidencias.py scripts/evidence_coverage_report.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepare ephemeral workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/quem-votar-overnight"
          mkdir -p "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Discover TSE-declared social seeds
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.workspace.outputs.path }}"
          python scripts/coletor_evidencias.py discover-tse-socials \
            --output "$OUT/tse-social-seeds.json" \
            | tee "$OUT/tse-social-discovery.log"

      - name: Merge baseline exact sources with overnight seeds
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.workspace.outputs.path }}"
          python - "$OUT/tse-social-seeds.json" "$OUT/topic-evidence-sources-merged.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          seed_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          baseline = json.loads(Path("data/staging/topic-evidence-sources.json").read_text(encoding="utf-8"))
          discovered = json.loads(seed_path.read_text(encoding="utf-8"))

          merged = {}
          for item in baseline.get("sources", []) + discovered.get("sources", []):
              key = (
                  str(item.get("candidate_id") or ""),
                  str(item.get("discovery_status") or ""),
                  str(item.get("source_url") or item.get("seed_url") or ""),
              )
              if all(key):
                  merged[key] = item

          payload = {
              "version": "1.0.0",
              "semantics": "Ephemeral overnight source inventory; non-canonical and artifact-only.",
              "sources": sorted(
                  merged.values(),
                  key=lambda x: (
                      str(x.get("candidate_name") or ""),
                      str(x.get("source_url") or x.get("seed_url") or ""),
                  ),
              ),
          }
          output_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"merged_sources={len(payload['sources'])}")
          PY

      - name: Validate merged staging without promotion
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.workspace.outputs.path }}"
          python scripts/coletor_evidencias.py validate \
            --sources "$OUT/topic-evidence-sources-merged.json" \
            --drafts data/staging/topic-evidence-drafts.json \
            --reviews data/staging/topic-evidence-reviews.json \
            | tee "$OUT/staging-validation.log"

      - name: Generate coverage ledger
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.workspace.outputs.path }}"
          python scripts/evidence_coverage_report.py \
            --sources "$OUT/topic-evidence-sources-merged.json" \
            --output "$OUT/evidence-coverage-ledger.json" \
            | tee "$OUT/coverage-summary.log"

      - name: Create provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.workspace.outputs.path }}"
          (
            cd "$OUT"
            sha256sum *.json *.log > SHA256SUMS.txt
          )
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$OUT/RUN_METADATA.txt"

      - name: Assert repository remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git status --short
            echo "::error::Read-only preflight modified tracked repository files."
            exit 1
          fi

      - name: Upload non-canonical overnight artifact
        uses: actions/upload-artifact@v4
        with:
          name: overnight-v55-evidence-preflight-${{ github.run_id }}
          path: ${{ steps.workspace.outputs.path }}
          if-no-files-found: error
          retention-days: 7
