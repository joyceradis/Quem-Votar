name: TEMP — Validar revisão semântica da Issue 5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-validate-once.yml"

permissions:
  contents: read

concurrency:
  group: evidence-validate-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência de PDF
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar staging e revisão
        run: python scripts/coletor_evidencias.py validate

      - name: Simular promoção sem escrever fonte canônica
        run: python scripts/coletor_evidencias.py promote
