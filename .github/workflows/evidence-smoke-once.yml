name: TEMP — Smoke test do coletor de evidências

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-smoke-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-smoke-once
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência de PDF
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar coletor
        run: |
          python -m py_compile scripts/coletor_evidencias.py
          python tests/test_coletor_evidencias.py

      - name: Executar coleta real de uma fonte
        id: collect
        continue-on-error: true
        run: python scripts/coletor_evidencias.py collect --limit 1 --delay 0

      - name: Exibir resultado do staging
        if: always()
        run: |
          echo "=== topic-evidence-drafts.json ==="
          cat data/staging/topic-evidence-drafts.json
          if [ -f data/staging/topic-evidence-rejections.json ]; then
            echo
            echo "=== topic-evidence-rejections.json ==="
            cat data/staging/topic-evidence-rejections.json
          fi

      - name: Publicar artefato de staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-smoke-staging
          path: |
            data/staging/topic-evidence-drafts.json
            data/staging/topic-evidence-rejections.json
          if-no-files-found: warn
          retention-days: 1

      - name: Confirmar que o draft bruto foi gerado
        if: always()
        run: |
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            echo "A coleta falhou; ver logs e artefato."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/staging/topic-evidence-drafts.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          drafts = payload.get("drafts")
          assert isinstance(drafts, list), "drafts precisa ser lista"
          assert len(drafts) == 1, f"esperado 1 draft; obtidos {len(drafts)}"
          draft = drafts[0]
          required = [
              "draft_id",
              "candidate_id",
              "source_url",
              "source_sha256",
              "content_sha256",
              "raw_excerpt",
          ]
          missing = [key for key in required if not draft.get(key)]
          assert not missing, f"campos ausentes: {missing}"
          assert draft.get("candidate_id") == "80002537487", "SQ_CANDIDATO inesperado"
          print("Draft bruto gerado e validado.")
          PY
