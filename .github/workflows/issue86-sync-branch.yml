name: Issue 86 — validar enriquecimento TSE na branch

on:
  push:
    branches:
      - data/issue-86-tse-enrichment
    paths:
      - scripts/sync-data.py
      - tests/test_tse_enrichment.py
      - .github/workflows/issue86-sync-branch.yml

permissions:
  contents: write

concurrency:
  group: issue-86-tse-enrichment
  cancel-in-progress: false

jobs:
  sync-branch:
    if: ${{ !contains(github.event.head_commit.message, '[issue86-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data/issue-86-tse-enrichment

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scripts/sync-data.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Inspecionar estrutura do mirror por SQ_CANDIDATO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, html as htmlmod
          url='https://meuvoto.org.br/candidato/80002549439.html'
          req=urllib.request.Request(url,headers={'User-Agent':'Quem-Votar-ES/4.0','Accept':'text/html'})
          with urllib.request.urlopen(req,timeout=30) as response:
              html=response.read().decode('utf-8',errors='replace')
          print('bytes',len(html))
          print('ids',re.findall(r'<(?:section|div|details)[^>]+id=["\']([^"\']+)',html,re.I)[:120])
          for title in ['Patrimônio declarado','Candidaturas anteriores','Site e redes declarados','Situação do registro']:
              i=html.lower().find(title.lower())
              print('\n###',title,'at',i)
              if i>=0:
                  chunk=html[max(0,i-1200):i+12000]
                  chunk=re.sub(r'<script.*?</script>','',chunk,flags=re.I|re.S)
                  print(chunk[:12000])
          PY
      - name: Coletar snapshot oficial TSE
        run: python scripts/sync-data.py

      - name: Auditar snapshot
        run: python scripts/audit-site.py

      - name: Gravar apenas data/generated na branch
        shell: bash
        run: |
          set -euo pipefail
          INVALID="$(git status --porcelain | awk '{print $2}' | grep -Ev '^data/generated/' || true)"
          if [[ -n "$INVALID" ]]; then
            echo "::error::sync alterou arquivo fora de data/generated"
            printf '%s\n' "$INVALID"
            exit 1
          fi
          if git diff --quiet -- data/generated; then
            echo "Nenhuma mudança em data/generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git commit -m "data: snapshot TSE enriquecido da #86 [issue86-generated]"
          git push origin HEAD:data/issue-86-tse-enrichment