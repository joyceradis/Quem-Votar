name: Issue 86 — validar enriquecimento TSE na branch

on:
  push:
    branches:
      - data/issue-86-tse-enrichment
    paths:
      - scripts/sync-data.py
      - tests/test_tse_enrichment.py
      - .github/workflows/issue86-sync-branch.yml

permissions:
  contents: write

concurrency:
  group: issue-86-tse-enrichment
  cancel-in-progress: false

jobs:
  sync-branch:
    if: ${{ !contains(github.event.head_commit.message, '[issue86-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: data/issue-86-tse-enrichment

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scripts/sync-data.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validar transporte intermediário para DivulgaCandContas
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          target = "https://divulgacandcontas.tse.jus.br/divulga/rest/v1/candidatura/buscar/2026/ES/20322002026/candidato/80002542409"
          probes = [
              ("allorigins", "https://api.allorigins.win/raw?url=" + urllib.parse.quote(target, safe="")),
              ("corsproxy", "https://corsproxy.io/?" + urllib.parse.quote(target, safe="")),
          ]
          ok = False
          for name, url in probes:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                  payload = json.loads(raw)
                  print(name, "OK", "candidate", payload.get("id"), "bens", len(payload.get("bens") or []), "sites", len(payload.get("sites") or []), "anteriores", len(payload.get("eleicoesAnteriores") or []))
                  print("keys", sorted(payload.keys())[:60])
                  ok = True
                  break
              except Exception as exc:
                  print(name, "FAIL", type(exc).__name__, exc)
          if not ok:
              raise SystemExit("nenhum transporte intermediário respondeu")
          PY

      - name: Coletar snapshot oficial TSE
        run: python scripts/sync-data.py

      - name: Auditar snapshot
        run: python scripts/audit-site.py

      - name: Gravar apenas data/generated na branch
        shell: bash
        run: |
          set -euo pipefail
          INVALID="$(git status --porcelain | awk '{print $2}' | grep -Ev '^data/generated/' || true)"
          if [[ -n "$INVALID" ]]; then
            echo "::error::sync alterou arquivo fora de data/generated"
            printf '%s\n' "$INVALID"
            exit 1
          fi
          if git diff --quiet -- data/generated; then
            echo "Nenhuma mudança em data/generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git commit -m "data: snapshot TSE enriquecido da #86 [issue86-generated]"
          git push origin HEAD:data/issue-86-tse-enrichment