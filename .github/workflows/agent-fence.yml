name: 🛡️ Cerca Elétrica para Agentes de IA

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # Permite que o bot comente no PR dando bronca na IA

jobs:
  vigia-de-agentes:
    name: 🛑 Inspetor de Regras da IA
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Corta rápido se a IA travar

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Pega só o commit atual e o anterior para comparar mudanças

      - name: 🚫 Bloquear alteração em documentos de governança
        # Se a IA tentar alterar suas metodologias ou regras sem você pedir, o workflow barra.
        run: |
          # Pega a lista de arquivos alterados no PR
          ALTERADOS=$(git diff --name-only HEAD^ HEAD)
          
          for ARQUIVO in $ALTERADOS; do
            if [[ "$ARQUIVO" == "AGENTS.md" || "$ARQUIVO" == "AUDITORIA.md" || "$ARQUIVO" == "METODOLOGIA.md" ]]; then
              echo "❌ ERRO CRÍTICO: Um agente tentou alterar $ARQUIVO!"
              echo "Agentes autônomos são proibidos de reescrever a governança do projeto."
              exit 1 # Isso quebra o workflow e trava o agente
            fi
          done
          echo "✅ Nenhuma violação de governança detectada."

      - name: 🔗 Validação de Links Cívicos
        # Como é um site político (Quem-Votar), a IA não pode quebrar links de fontes.
        uses: lycheeverse/lychee-action@v2
        with:
          args: '--offline --no-progress "./**/*.html"'
          fail: true

      - name: 🧹 Verificar Sintaxe (Sem bagunçar o código)
        # Em vez de tentar consertar e gerar um loop, o workflow usa uma ferramenta 
        # super rápida e determinística (Biome) escrita em Rust para ver se a IA quebrou o HTML/JS.
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      
      - name: Rodar auditoria de código
        # Se a IA cuspiu código ruim, o Biome trava o PR aqui. A IA vai ver o erro e consertar sozinha.
        run: biome ci ./
