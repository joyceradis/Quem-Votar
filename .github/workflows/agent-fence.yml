name: 🛡️ Cerca Elétrica para Agentes de IA

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  vigia-de-agentes:
    name: 🛑 Inspetor de Regras da IA
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Baixar código e histórico necessário
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 🚫 Proteger governança e control plane
        id: governance
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort -u > /tmp/arquivos-alterados.txt

          echo "Arquivos alterados no PR:"
          cat /tmp/arquivos-alterados.txt

          PROTEGIDOS='^(AGENTS\.md|AUDITORIA\.md|METODOLOGIA\.md|scripts/audit-site\.py|docs/(GOVERNANCE|DELIVERY_GOVERNANCE|PRODUCT_NORTH_STAR|TOPIC_EVIDENCE)\.md|\.github/(CODEOWNERS|workflows/))'

          VIOLACOES=$(grep -E "$PROTEGIDOS" /tmp/arquivos-alterados.txt || true)

          if [[ -n "$VIOLACOES" ]]; then
            echo "❌ ALTERAÇÃO BLOQUEADA."
            echo "Este PR altera arquivos de governança ou do control plane:"
            echo "$VIOLACOES"
            echo
            echo "Esses arquivos não podem ser modificados por PR automatizado."
            echo "Mudanças deliberadas de governança devem ser feitas explicitamente pela mantenedora fora deste fluxo."
            exit 1
          fi

          echo "✅ Nenhuma violação de governança/control plane detectada."

      - name: 💬 Explicar bloqueio no PR
        if: failure() && steps.governance.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = [
              "🛑 **Cerca elétrica acionada**",
              "",
              "Este PR tentou alterar um arquivo protegido de governança ou do control plane.",
              "Arquivos protegidos incluem AGENTS.md, AUDITORIA.md, METODOLOGIA.md, scripts/audit-site.py, documentos normativos em docs/, CODEOWNERS e workflows em .github/workflows/.",
              "",
              "A alteração precisa ser deliberada pela mantenedora e feita fora deste fluxo automatizado."
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: 🔗 Validar links internos
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: '--offline --no-progress "./**/*.html" "./**/*.md"'
          fail: true

      - name: 🌐 Verificar saúde de links externos
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: '--no-progress --max-retries 2 --timeout 20 "./**/*.html" "./**/*.md"'
          fail: true

      - name: 🧹 Validar sintaxe determinística
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python -m py_compile scripts/sync-data.py scripts/audit-site.py

      - name: 🧪 Rodar auditoria nativa do projeto
        run: python scripts/audit-site.py
