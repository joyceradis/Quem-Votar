name: Qualidade do site

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.html"
      - "styles.css"
      - "app.js"
      - "scripts/**"
      - "tests/**"
      - "data/generated/**"
      - "data/reference/**"
      - "data/staging/**"
      - "docs/**"
      - "AGENTS.md"
      - "AUDITORIA.md"
      - "METODOLOGIA.md"
      - "requirements-evidence.txt"
      - ".github/CODEOWNERS"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: quality-site
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de evidências
        run: python -m pip install -r requirements-evidence.txt

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py scripts/coletor_evidencias.py
          node --check app.js

      - name: Executar testes determinísticos
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Auditar contratos de dados, interface e entrega
        run: python scripts/audit-site.py
