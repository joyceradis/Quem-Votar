name: Qualidade do site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "styles.css"
      - "app.js"
      - "scripts/**"
      - "data/generated/**"
      - "data/reference/**"
      - "docs/DELIVERY_GOVERNANCE.md"
      - "docs/PRODUCT_NORTH_STAR.md"
      - "docs/TOPIC_EVIDENCE.md"
      - "AGENTS.md"
      - ".github/workflows/quality.yml"
      - ".github/workflows/sync-data.yml"

permissions:
  contents: read

concurrency:
  group: quality-site
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/sync-data.py scripts/audit-site.py
          node --check app.js

      - name: Auditar contratos de dados, interface e entrega
        run: python scripts/audit-site.py
