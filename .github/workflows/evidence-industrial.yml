name: Evidence wartime worker — artifact only

on:
  workflow_dispatch:
    # Authorization-Issue: #171 (bounded, operator-triggered recovery only).
    inputs:
      recovery_source_run_id:
        description: "Run ID do artifact histórico com as fontes oficiais"
        required: false
        type: string
      reprocess_source_ids:
        description: "Source IDs exatos separados por vírgula (máximo de 20)"
        required: false
        type: string
  schedule:
    # Horária, não a cada 5 minutos (Authorization-Issue: #169).
    #
    # A cadência de 5 minutos era desproporcional à taxa real de mudança das
    # fontes (TSE, Câmara e ALES publicam no máximo uma vez ao dia) e, com
    # timeout-minutes: 300 e cancel-in-progress: false, permitia empilhar
    # dezenas de execuções na fila — provável origem do ruído de
    # persistent_failures registrado no checkpoint.
    #
    # workflow_dispatch continua disponível para execução sob demanda, que é
    # o caminho certo quando há urgência real.
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-industrial.yml"
      - "scripts/discover_evidence_sources.py"
      - "scripts/camara_bulk.py"
      - "scripts/process_evidence_batch.py"
      - "scripts/prepare_chamber_recovery.py"
      - "scripts/build_exception_queue.py"
      - "scripts/evidence_coverage_report.py"
      - "scripts/cruise_worker_guard.py"
      - "scripts/build_curation_batch.py"
      - "data/staging/wartime-curation-decisions.json"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: evidence-wartime-worker
  cancel-in-progress: false

jobs:
  window-gate:
    runs-on: ubuntu-latest
    outputs:
      stop: ${{ steps.check.outputs.stop }}
    steps:
      - name: Check #35 wartime-worker window
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 35,
              per_page: 100
            });
            const stopped = comments.some(comment =>
              comment.user?.login === "joyceradis" &&
              /^\s*\/(?:stop-full-pass|stop-continuous-worker|stop-wartime-worker)\b/im.test(comment.body || "")
            );
            core.setOutput("stop", stopped ? "true" : "false");
            if (stopped) {
              core.notice("Wartime worker closed by maintainer signal in #35.");
            }

  industrial:
    needs: window-gate
    if: ${{ needs.window-gate.outputs.stop != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install evidence dependencies
        run: python -m pip install -r requirements-evidence.txt

      - name: Validate pipeline before processing
        run: |
          python -m py_compile \
            scripts/coletor_evidencias.py \
            scripts/discover_evidence_sources.py \
            scripts/camara_bulk.py \
            scripts/process_evidence_batch.py \
            scripts/prepare_chamber_recovery.py \
            scripts/build_exception_queue.py \
            scripts/evidence_coverage_report.py \
            scripts/cruise_worker_guard.py \
            scripts/build_curation_batch.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/audit-site.py

      - name: Prepare workspaces
        id: ws
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence-industrial-output"
          STATE="$RUNNER_TEMP/evidence-industrial-state"
          BULK="$RUNNER_TEMP/camara-bulk-cache"
          RECOVERY="$RUNNER_TEMP/chamber-recovery-source"
          mkdir -p "$OUT" "$STATE" "$BULK" "$RECOVERY"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "bulk=$BULK" >> "$GITHUB_OUTPUT"
          echo "recovery=$RECOVERY" >> "$GITHUB_OUTPUT"

      - name: Resolve Câmara bulk cache day
        id: bulk-key
        shell: bash
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore daily Câmara bulk cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.ws.outputs.bulk }}
          key: camara-bulk-v1-${{ runner.os }}-${{ steps.bulk-key.outputs.day }}

      - name: Restore non-canonical processing state
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.ws.outputs.state }}
          key: evidence-industrial-v2-quality-${{ github.run_id }}
          restore-keys: |
            evidence-industrial-v2-quality-

      - name: Initialize state if absent
        shell: bash
        run: |
          set -euo pipefail
          STATE="${{ steps.ws.outputs.state }}"

          if [[ ! -f "$STATE/drafts.json" ]]; then
            cp data/staging/topic-evidence-drafts.json "$STATE/drafts.json"
          fi

          if [[ ! -f "$STATE/processing-state.json" ]]; then
            cat > "$STATE/processing-state.json" <<'JSON'
          {
            "version": "1.0.0",
            "semantics": "Non-canonical operational state for reliable evidence processing.",
            "sources": {}
          }
          JSON
          fi

          if [[ ! -f "$STATE/exception-queue.json" ]]; then
            cat > "$STATE/exception-queue.json" <<'JSON'
          {
            "version": "1.0.0",
            "semantics": "Non-canonical exception history.",
            "exceptions": []
          }
          JSON
          fi

      - name: Validate selective recovery inputs
        id: recovery
        shell: bash
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
          RECOVERY_SOURCE_IDS: ${{ inputs.reprocess_source_ids }}
        run: |
          set -euo pipefail
          if [[ -z "$RECOVERY_SOURCE_RUN_ID" && -z "$RECOVERY_SOURCE_IDS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$RECOVERY_SOURCE_RUN_ID" =~ ^[0-9]{1,15}$ || -z "$RECOVERY_SOURCE_IDS" ]]; then
            echo "::error::Recovery requires a numeric source run ID and explicit source IDs."
            exit 1
          fi
          IFS=',' read -r -a source_ids <<< "$RECOVERY_SOURCE_IDS"
          if [[ "${#source_ids[@]}" -gt 20 ]]; then
            echo "::error::Selective recovery is limited to 20 source IDs per run."
            exit 1
          fi
          for source_id in "${source_ids[@]}"; do
            if [[ ! "$source_id" =~ ^[0-9a-f]{20}$ ]]; then
              echo "::error::Every recovery source ID must be 20 lowercase hexadecimal characters."
              exit 1
            fi
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download historical source artifact
        if: ${{ steps.recovery.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: evidence-worker-${{ inputs.recovery_source_run_id }}
          run-id: ${{ inputs.recovery_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ steps.ws.outputs.recovery }}

      - name: Discover candidate-specific sources
        if: ${{ steps.recovery.outputs.enabled != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          BULK="${{ steps.ws.outputs.bulk }}"
          python scripts/discover_evidence_sources.py \
            --output-sources "$OUT/topic-evidence-sources.json" \
            --output-rejections "$OUT/discovery-rejections.json" \
            --metrics "$OUT/discovery-metrics.json" \
            --site-workers 8 \
            --max-links-per-site 20 \
            --chamber-bulk-cache-dir "$BULK" \
            --chamber-bulk-years 2023 2024 2025 2026 \
            | tee "$OUT/discovery.log"

      - name: Prepare selective Chamber recovery sources
        if: ${{ steps.recovery.outputs.enabled == 'true' }}
        shell: bash
        env:
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
          RECOVERY_SOURCE_IDS: ${{ inputs.reprocess_source_ids }}
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python scripts/prepare_chamber_recovery.py \
            --artifact-dir "${{ steps.ws.outputs.recovery }}" \
            --state "$STATE/processing-state.json" \
            --source-ids "$RECOVERY_SOURCE_IDS" \
            --expected-run-id "$RECOVERY_SOURCE_RUN_ID" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --output-sources "$OUT/topic-evidence-sources.json" \
            --output-audit "$OUT/recovery-source-selection.json"
          printf '%s\n' "$RECOVERY_SOURCE_IDS" | python -c '
          import json, sys
          from pathlib import Path
          source_ids = [item.strip() for item in sys.stdin.read().split(",") if item.strip()]
          Path(sys.argv[1]).write_text(json.dumps({"rejections": []}, indent=2) + "\n")
          Path(sys.argv[2]).write_text(
              "mode=selective_chamber_recovery\n"
              f"selected_source_ids={len(source_ids)}\n",
              encoding="utf-8",
          )
          ' "$OUT/discovery-rejections.json" "$OUT/discovery.log"

      - name: Drain exact-content backlog continuously
        shell: bash
        env:
          RECOVERY_SOURCE_IDS: ${{ inputs.reprocess_source_ids }}
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          : > "$OUT/processing.log"
          processor_args=(
            --sources "$OUT/topic-evidence-sources.json"
            --existing-drafts "$STATE/drafts.json"
            --state "$STATE/processing-state.json"
            --output-drafts "$STATE/drafts.json"
            --output-failures "$OUT/processing-failures-current.json"
            --max-attempts 3
            --retries-per-run 2
            --workers 8
            --limit 200
            --per-candidate-limit 12
          )
          if [[ -n "${RECOVERY_SOURCE_IDS:-}" ]]; then
            IFS=',' read -r -a source_ids <<< "$RECOVERY_SOURCE_IDS"
            for source_id in "${source_ids[@]}"; do
              processor_args+=(--reprocess-source-id "$source_id")
            done
          fi

          cycle=0
          max_cycles=100

          while true; do
            cycle=$((cycle + 1))
            METRICS="$OUT/processing-metrics-cycle-${cycle}.json"

            echo "=== wartime cycle ${cycle} ===" | tee -a "$OUT/processing.log"

            python scripts/process_evidence_batch.py \
              "${processor_args[@]}" \
              --metrics "$METRICS" \
              | tee -a "$OUT/processing.log"

            cp "$METRICS" "$OUT/processing-metrics.json"

            read -r queued eligible progressed <<<"$(python - "$METRICS" <<'PY'
          import json
          import sys
          from pathlib import Path

          m = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          queued = int(m.get("queued", 0))
          eligible = int(m.get("eligible_before_fair_batch", 0))
          progressed = sum(
              int(m.get(k, 0))
              for k in ("collected", "failed", "quarantined", "rejected")
          )
          print(queued, eligible, progressed)
          PY
            )"

            echo "wartime_cycle=${cycle} queued=${queued} eligible=${eligible} progressed=${progressed}" \
              | tee -a "$OUT/processing.log"

            if [[ "$queued" -eq 0 ]]; then
              echo "wartime_backlog_drained=true" | tee -a "$OUT/processing.log"
              stop_reason=drained
              break
            fi

            if [[ "$progressed" -eq 0 ]]; then
              echo "::error::Wartime worker made no progress with queued work remaining."
              exit 1
            fi

            if [[ "$cycle" -ge "$max_cycles" ]]; then
              echo "::notice::Wartime budget reached; validating partial state for resume."
              stop_reason=budget_exhausted
              break
            fi
          done

          python - "$OUT/drain-status.json" "$stop_reason" "$cycle" "$eligible" <<'PYCODE'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "stop_reason": sys.argv[2],
              "backlog_drained": sys.argv[2] == "drained",
              "cycles": int(sys.argv[3]),
              "eligible_before_last_batch": int(sys.argv[4]),
              "base_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "semantics": "Partial progress is resumable only after downstream validation. Not canonical evidence."
          }, indent=2) + "\n", encoding="utf-8")
          PYCODE

      - name: Record selective recovery outcome
        if: ${{ steps.recovery.outputs.enabled == 'true' }}
        shell: bash
        env:
          RECOVERY_SOURCE_IDS: ${{ inputs.reprocess_source_ids }}
          RECOVERY_SOURCE_RUN_ID: ${{ inputs.recovery_source_run_id }}
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python - "$STATE/processing-state.json" "$STATE/drafts.json" \
            "$OUT/recovery-source-selection.json" "$OUT/recovery-audit.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["sources"]
          drafts = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))["drafts"]
          selection = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          draft_by_id = {row.get("draft_id"): row for row in drafts}
          results = []
          for source_id in selection["source_ids"]:
              row = state.get(source_id, {})
              draft = draft_by_id.get(row.get("draft_id"), {})
              results.append({
                  "source_id": source_id,
                  "status": row.get("status"),
                  "attempts": row.get("attempts"),
                  "reprocess_count": row.get("reprocess_count"),
                  "chamber_section_recovery_v1": row.get("chamber_section_recovery_v1", False),
                  "draft_id": row.get("draft_id"),
                  "draft_review_status": draft.get("review_status"),
              })
          Path(sys.argv[4]).write_text(json.dumps({
              "source_run_id": os.environ["RECOVERY_SOURCE_RUN_ID"],
              "selected_sources": len(results),
              "migration_complete": all(
                  row["status"] == "collected"
                  and row["chamber_section_recovery_v1"] is True
                  and row["draft_review_status"] == "pending"
                  for row in results
              ),
              "sources": results,
              "semantics": "Non-canonical migration evidence; drafts remain pending human review.",
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Materialize persistent processing failures
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python - "$STATE/processing-state.json" "$OUT/processing-failures.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          state = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          failures = []
          for source_id, row in (state.get("sources") or {}).items():
              if row.get("status") not in {"failed", "quarantined", "rejected"}:
                  continue
              error = str(row.get("last_error") or "")
              failure_id = hashlib.sha256(
                  f"{source_id}\n{error}".encode("utf-8")
              ).hexdigest()[:20]
              failures.append({
                  "failure_id": failure_id,
                  "source_id": source_id,
                  "candidate_id": row.get("candidate_id"),
                  "source_url": row.get("source_url"),
                  "stage": "collection",
                  "error": error,
                  "attempts_used": row.get("attempts", 0),
                  "processing_status": row.get("status"),
              })
          Path(sys.argv[2]).write_text(
              json.dumps({
                  "version": "1.0.0",
                  "semantics": "Persistent operational failures from processing state.",
                  "failures": failures,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"persistent_failures={len(failures)}")
          PY

      - name: Build exception queue with history
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python scripts/build_exception_queue.py build             --discovery-rejections "$OUT/discovery-rejections.json"             --processing-failures "$OUT/processing-failures.json"             --drafts "$STATE/drafts.json"             --previous "$STATE/exception-queue.json"             --output "$STATE/exception-queue-next.json"             --metrics "$OUT/exception-metrics.json"             | tee "$OUT/exceptions.log"
          mv "$STATE/exception-queue-next.json" "$STATE/exception-queue.json"

      - name: Generate scoped coverage ledger
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python scripts/evidence_coverage_report.py             --sources "$OUT/topic-evidence-sources.json"             --drafts "$STATE/drafts.json"             --processing-state "$STATE/processing-state.json"             --exception-queue "$STATE/exception-queue.json"             --output "$OUT/evidence-coverage-ledger.json"             | tee "$OUT/coverage.log"

      - name: Prepare human-review handoff
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python - "$STATE/exception-queue.json" "$STATE/drafts.json" "$OUT/human-review-handoff.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          queue = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          drafts = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          human = [
              row for row in queue.get("exceptions", [])
              if row.get("status") == "open" and row.get("requires_human") is True
          ]
          human_draft_ids = {row.get("draft_id") for row in human if row.get("draft_id")}
          draft_rows = [
              row for row in drafts.get("drafts", [])
              if row.get("draft_id") in human_draft_ids
          ]
          result = {
              "semantics": (
                  "Human review handoff only. No entry is approved or canonical. "
                  "Retryable/data-quality failures are intentionally excluded."
              ),
              "human_review_count": len(human),
              "exceptions": human,
              "related_drafts": draft_rows,
          }
          Path(sys.argv[3]).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"human_review_count={len(human)}")
          PY

      - name: Build new-work curation delta
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python scripts/build_curation_batch.py \
            --drafts "$STATE/drafts.json" \
            --canonical data/reference/topic-evidence.json \
            --decisions data/staging/wartime-curation-decisions.json \
            --sources "$OUT/topic-evidence-sources.json" \
            --output "$OUT/curation-batch.json" \
            --metrics "$OUT/curation-batch-metrics.json" \
            --limit 100 \
            --per-candidate-limit 12

      - name: Validate persistent state
        shell: bash
        run: |
          set -euo pipefail
          STATE="${{ steps.ws.outputs.state }}"
          python - "$STATE" <<'PY'
          import json
          import sys
          from pathlib import Path

          base = Path(sys.argv[1])
          state = json.loads((base / "processing-state.json").read_text(encoding="utf-8"))
          drafts = json.loads((base / "drafts.json").read_text(encoding="utf-8"))
          queue = json.loads((base / "exception-queue.json").read_text(encoding="utf-8"))
          assert isinstance(state.get("sources"), dict)
          assert isinstance(drafts.get("drafts"), list)
          assert isinstance(queue.get("exceptions"), list)
          draft_ids = [x.get("draft_id") for x in drafts["drafts"]]
          assert all(draft_ids) and len(draft_ids) == len(set(draft_ids))
          print(
              f"state_ok sources={len(state['sources'])} "
              f"drafts={len(drafts['drafts'])} exceptions={len(queue['exceptions'])}"
          )
          PY

      - name: Build cruise-mode health and batching report
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          python scripts/cruise_worker_guard.py \
            --sources "$OUT/topic-evidence-sources.json" \
            --failures "$OUT/processing-failures.json" \
            --drafts "$STATE/drafts.json" \
            --canonical data/reference/topic-evidence.json \
            --federal data/generated/candidates-federal.json \
            --estadual data/generated/candidates-estadual.json \
            --output "$OUT/cruise-status.json"

      - name: Export state snapshot and provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          STATE="${{ steps.ws.outputs.state }}"
          cp "$STATE/processing-state.json" "$OUT/processing-state.json"
          cp "$STATE/drafts.json" "$OUT/topic-evidence-drafts.json"
          cp "$STATE/exception-queue.json" "$OUT/exception-queue.json"
          (
            cd "$OUT"
            sha256sum *.json *.log > SHA256SUMS.txt
          )
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$OUT/RUN_METADATA.txt"

      - name: Assert repository remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            git status --short
            echo "::error::Industrial evidence pass modified tracked repository files."
            exit 1
          fi

      - name: Save non-canonical processing state
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.ws.outputs.state }}
          key: evidence-industrial-v2-quality-${{ github.run_id }}

      - name: Upload industrial evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-worker-${{ github.run_id }}
          path: ${{ steps.ws.outputs.out }}
          if-no-files-found: error
          retention-days: 7

      - name: Page only on actionable cruise incidents
        shell: bash
        env:
          RECOVERY_ENABLED: ${{ steps.recovery.outputs.enabled }}
        run: |
          set -euo pipefail
          OUT="${{ steps.ws.outputs.out }}"
          python - "$OUT/cruise-status.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          count = int((report.get("metrics") or {}).get("actionable_incidents", 0))
          if count:
              print(json.dumps(report.get("incidents") or [], ensure_ascii=False, indent=2))
              raise SystemExit(
                  f"cruise-mode incident: {count} actionable institutional failure(s)"
              )
          if os.environ["RECOVERY_ENABLED"] == "true":
              recovery = json.loads(
                  (Path(sys.argv[1]).parent / "recovery-audit.json").read_text(encoding="utf-8")
              )
              if recovery.get("migration_complete") is not True:
                  print(json.dumps(recovery, ensure_ascii=False, indent=2))
                  raise SystemExit(
                      "selective Chamber recovery did not migrate every source to a pending draft"
                  )
          print("wartime_worker_ok: silent success")
          PY
