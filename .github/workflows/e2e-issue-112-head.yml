name: E2E HEAD #112

on:
  push:
    branches: [test/issue-112-head-e2e]

permissions:
  contents: read

jobs:
  head-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright isolado
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validar produção: desktop, teclado, abas e mobile
        env:
          QV_BASE_URL: https://joyceradis.github.io/Quem-Votar/
        run: node tests/e2e_issue_112_head.cjs
