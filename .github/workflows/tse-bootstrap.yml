name: Coletar bootstrap TSE dos cargos majoritários

# Versão TEMPORÁRIA de diagnóstico (branch claude/tse-diagnose, não vai para main):
# só lê e imprime o cabeçalho do CSV de histórico de candidaturas do TSE e, de
# um candidato de amostra, colunas não sensíveis. Nada é escrito no repositório.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Diagnóstico do CSV de histórico do TSE
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cabeçalho e amostra não sensível
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import io
          import re
          import urllib.request
          import zipfile

          UA = "Quem-Votar-ES/4.0 (+https://github.com/joyceradis/Quem-Votar)"
          URL = "https://cdn.tse.jus.br/estatistica/sead/odsele/historico_candidatura/historico_candidatura_2026.zip"
          req = urllib.request.Request(URL, headers={"User-Agent": UA})
          raw = urllib.request.urlopen(req, timeout=120).read()
          archive = zipfile.ZipFile(io.BytesIO(raw))
          print("membros:", archive.namelist())
          member = next(n for n in archive.namelist() if n.endswith("_ES.csv"))
          text = archive.read(member).decode("latin-1")
          reader = csv.DictReader(io.StringIO(text), delimiter=";")
          print("colunas:", reader.fieldnames)
          sensivel = re.compile(r"CPF|TITULO|EMAIL|NASC|TELEFONE|ENDERECO|NM_CANDIDATO|NM_SOCIAL", re.I)
          seguras = [f for f in reader.fieldnames if not sensivel.search(f)]
          print("colunas não sensíveis usadas na amostra:", seguras)
          amostra = "80002552692"
          shown = 0
          for row in reader:
              if amostra in row.values():
                  print("linha:", {k: row[k] for k in seguras})
                  shown += 1
                  if shown >= 3:
                      break
          print("linhas de amostra:", shown)
          PY
