<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="footer-art-title footer-art-desc">
  <title id="footer-art-title">Terceira Ponte e Convento da Penha</title>
  <desc id="footer-art-desc">Desenho de linha em azul-marinho da Terceira Ponte diante do Convento da Penha, sobre o contorno do morro e da baía.</desc>
  <g fill="none" stroke="#113b56" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ponte: tabuleiro contínuo e pilares retos, sem moldura nem preenchimento. -->
    <path d="M18 126 C108 107 191 88 274 76 C363 63 441 64 519 78"/>
    <path d="M21 137 C111 118 194 99 276 87 C363 75 438 75 513 89"/>
    <path d="M117 105 V177 M224 85 V177 M331 69 V177 M437 67 V166"/>
    <path d="M106 177 H129 M213 177 H236 M320 177 H343 M427 166 H448"/>

    <!-- Morro: linha única conduz o olhar da ponte ao convento. -->
    <path d="M480 151 C510 117 535 81 568 66 C602 50 641 63 672 105 C682 119 691 135 699 151"/>
    <path d="M488 151 H704"/>

    <!-- Convento: capela, campanário, telhados e vãos em traço uniforme. -->
    <path d="M555 91 H643 M563 91 V69 L583 51 L603 69 V91 M576 91 V72 H590 V91"/>
    <path d="M604 91 V53 L620 37 L636 53 V91 M612 64 H628 M618 91 V75 H623 V91"/>
    <path d="M583 51 V35 M577 41 H589"/>

    <!-- Água: pequenos gestos abertos, sem linha de contorno fechada. -->
    <path d="M40 194 C65 189 87 190 108 194 M158 202 C190 197 216 198 243 202"/>
    <path d="M361 194 C389 189 417 190 443 194 M517 203 C545 198 571 199 597 203"/>
  </g>
</svg>
